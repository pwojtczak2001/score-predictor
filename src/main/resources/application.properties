spring.application.name=score-predictor
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=ScorePredictor;encrypt=true;trustServerCertificate=true;
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.dialect=org.hibernate.dialect.SQLServerDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update
json.file.path=flashscore_scraping/src/data/poland_ekstraklasa_2026_2027.json
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000



